[build-system]
requires = ["setuptools >= 72.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tweetbot"
version = "0.0.0"
dependencies = [
  "mastodon-py>=2.2.1",
  "mwclient>=0.11.0",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "wheel",
]
lint = [
  "ruff==0.16.5",
  "yamllint==1.38.0",
]

[project.scripts]
tweetbot = "tweetbot:main"

[tool.setuptools.packages.find]
exclude = ["tmp"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# flake8 ran all of pycodestyle, which ruff leaves off by default.
extend-select = ["E", "W"]
